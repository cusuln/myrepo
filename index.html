<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>波浪模拟演示</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07131d;
      color: #e6f4f7;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background: radial-gradient(ellipse at 50% 0%, #12334a 0%, #07131d 58%);
    }

    main {
      width: min(940px, 100%);
      border: 1px solid #244554;
      border-radius: 20px;
      padding: clamp(20px, 5vw, 42px);
      background: rgb(9 26 37 / 88%);
      box-shadow: 0 24px 80px rgb(0 0 0 / 30%);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #62d9d0;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.7rem); }

    .intro { color: #a9c2ca; line-height: 1.6; }

    .chart {
      position: relative;
      margin-top: 26px;
      overflow: hidden;
      border: 1px solid #244554;
      border-radius: 14px;
      background: linear-gradient(180deg, #0d2533, #091a26);
    }

    canvas { display: block; width: 100%; height: 340px; }

    .readout {
      position: absolute;
      top: 16px;
      left: 18px;
      color: #a9c2ca;
      font-size: 0.9rem;
    }

    .readout strong { color: #fff; font-variant-numeric: tabular-nums; }

    .controls {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-top: 20px;
      color: #a9c2ca;
    }

    button {
      min-width: 112px;
      border: 0;
      border-radius: 999px;
      padding: 11px 18px;
      background: #62d9d0;
      color: #06171d;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #8be9e1; }
    button:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    input { width: min(240px, 35vw); accent-color: #62d9d0; }
    #status { margin-left: auto; font-size: 0.85rem; }
    #status[data-error="true"] { color: #ff9a9a; }

    @media (max-width: 560px) {
      body { padding: 14px; }
      .controls { flex-wrap: wrap; gap: 12px; }
      #status { width: 100%; margin-left: 0; }
      canvas { height: 260px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Linear wave superposition</p>
    <h1>波浪模拟</h1>
    <p class="intro">页面每帧向 Python 接口提交采样位置和时间，由 <code>calculate_wave_height</code> 计算叠加波高，再绘制成动态波形。</p>

    <section class="chart" aria-label="实时波浪图">
      <canvas id="wave-canvas"></canvas>
      <div class="readout">模拟时间 <strong id="time-readout">0.00</strong> s</div>
    </section>

    <div class="controls">
      <button id="toggle" type="button">暂停模拟</button>
      <label for="speed">速度</label>
      <input id="speed" type="range" min="0.2" max="2.5" step="0.1" value="1">
      <span id="speed-readout">1.0×</span>
      <span id="status" role="status">正在连接模拟接口…</span>
    </div>
  </main>

  <script>
    const canvas = document.querySelector("#wave-canvas");
    const context = canvas.getContext("2d");
    const toggleButton = document.querySelector("#toggle");
    const speedSlider = document.querySelector("#speed");
    const speedReadout = document.querySelector("#speed-readout");
    const timeReadout = document.querySelector("#time-readout");
    const status = document.querySelector("#status");
    const domainLength = Math.PI * 4;
    const sampleCount = 180;
    const positions = Array.from(
      { length: sampleCount },
      (_, index) => domainLength * index / (sampleCount - 1)
    );
    const waves = [
      { amplitude: 0.8, wave_number: 1.1, angular_frequency: 0.8, phase: 0 },
      { amplitude: 0.35, wave_number: 2.3, angular_frequency: 1.35, phase: 0.7 }
    ];

    let simulationTime = 0;
    let lastUpdate = performance.now();
    let running = true;
    let requestPending = false;
    let latestSamples = [];

    function resizeCanvas() {
      const bounds = canvas.getBoundingClientRect();
      const pixelRatio = window.devicePixelRatio || 1;
      canvas.width = Math.round(bounds.width * pixelRatio);
      canvas.height = Math.round(bounds.height * pixelRatio);
      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      drawWave();
    }

    function drawWave() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      if (!width || !height) return;

      context.clearRect(0, 0, width, height);
      const centerY = height / 2;
      const verticalScale = height * 0.3;

      context.strokeStyle = "rgb(145 188 201 / 18%)";
      context.lineWidth = 1;
      context.beginPath();
      context.moveTo(0, centerY);
      context.lineTo(width, centerY);
      context.stroke();

      if (latestSamples.length === 0) return;
      const gradient = context.createLinearGradient(0, 0, width, 0);
      gradient.addColorStop(0, "#35a9c8");
      gradient.addColorStop(0.55, "#62d9d0");
      gradient.addColorStop(1, "#b0f3db");
      context.strokeStyle = gradient;
      context.lineWidth = 3;
      context.lineJoin = "round";
      context.shadowColor = "rgb(98 217 208 / 45%)";
      context.shadowBlur = 14;
      context.beginPath();
      latestSamples.forEach((sample, index) => {
        const x = index * width / (latestSamples.length - 1);
        const y = centerY - sample.height * verticalScale;
        if (index === 0) context.moveTo(x, y);
        else context.lineTo(x, y);
      });
      context.stroke();
      context.shadowBlur = 0;
    }

    async function updateWave(now) {
      const elapsed = Math.min((now - lastUpdate) / 1000, 0.15);
      lastUpdate = now;
      if (running && !requestPending) {
        simulationTime += elapsed * Number(speedSlider.value);
        timeReadout.textContent = simulationTime.toFixed(2);
        requestPending = true;
        try {
          const response = await fetch("/api/wave-height", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ time: simulationTime, positions, waves })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || `HTTP ${response.status}`);
          latestSamples = result.samples;
          status.textContent = "接口已连接";
          status.dataset.error = "false";
          drawWave();
        } catch (error) {
          status.textContent = `接口错误：${error.message}`;
          status.dataset.error = "true";
        } finally {
          requestPending = false;
        }
      }
      window.setTimeout(() => requestAnimationFrame(updateWave), 80);
    }

    toggleButton.addEventListener("click", () => {
      running = !running;
      toggleButton.textContent = running ? "暂停模拟" : "继续模拟";
      lastUpdate = performance.now();
    });

    speedSlider.addEventListener("input", () => {
      speedReadout.textContent = `${Number(speedSlider.value).toFixed(1)}×`;
    });

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    requestAnimationFrame(updateWave);
  </script>
</body>
</html>
